<style>
:root{

}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
@media (prefers-color-scheme: dark){

    --line:#382e46; --text:#f2ecf6; --muted:#a99bb6; --faint:#7c7088;
    --accent:#efa64f; --accent-2:#f6bd73; --accent-ink:#2a1a06; --accent-soft:#3a2b17;
    --jade:#68c6a4; --jade-ink:#07271c; --jade-soft:#1b3a30; --gold:#e6b43f; --danger:#e5718a;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#140f1b; --bg-elev:#1d1626; --surface:#231b2e; --surface-2:#2e2539;
  --line:#382e46; --text:#f2ecf6; --muted:#a99bb6; --faint:#7c7088;
  --accent:#efa64f; --accent-2:#f6bd73; --accent-ink:#2a1a06; --accent-soft:#3a2b17;
  --jade:#68c6a4; --jade-ink:#07271c; --jade-soft:#1b3a30; --gold:#e6b43f; --danger:#e5718a;

body{margin:0; background:var(--bg); color:var(--text); font-family:"Hanken Grotesque",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased; min-height:100svh;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:40;}

::selection{background:var(--accent-soft)}
.wrap{max-width:620px; margin:0 auto; padding:0 18px}

.btn:active{transform:scale(.97)} .btn:hover{filter:brightness(1.04)}
.btn.block{width:100%; display:block} .btn.ghost{background:var(--surface-2); color:var(--text)}

.btn.sm{padding:9px 15px; font-size:14px} .btn:disabled{opacity:.6; cursor:default}
.field{width:100%; border:1.5px solid var(--line); background:var(--bg-elev); color:var(--text); border-radius:var(--r-sm); padding:13px 15px; font-size:16px; outline:none; transition:border-color .15s;}

.tunota .tn-lbl{color:var(--muted); font-weight:600; font-size:14px}

<body>
<div id="app"><div class="center-load"><div><div class="spin"></div>cargando…</div></div></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ========= CONFIG (claves públicas, seguras en el navegador) ========= */
var SUPABASE_URL      = "https://haviyreegwsmjouzjbqi.supabase.co";
var SUPABASE_ANON_KEY = "sb_publishable_C_8u0SolgkKU9fEQ1adplA_wqolI97V";
var FOUNDER_UID       = "7a4af0da-a549-4cbd-9057-0fac8c470bb9";
var FOUNDER_TITLE     = "Founder & CEO";
var TMDB_KEY          = "e0d764b988eef37826ef8926a9174b05";
/* ===================================================================== */

var ALPHA="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
var AVA_COLORS=["#c9761a","#2a9b76","#5b6ee1","#c0485f","#8a52c7","#2f9bb5","#c7962f","#d8577f"];
var sb=null, channel=null, cloudReady=false;
var me={id:null,name:""};
var S={view:"loading",authMode:"in",_email:"",listId:null,filter:"all",meta:null,members:[],movies:[],mrat:{},loading:true,_pendingHash:null,homeLists:null,homeLoading:false};
var modal=null, editingId=null, _memberTried=false, _rf=null, _rateVal=0;
var _rateSave=null, _rateRemove=null, _rateNoNote=false;
var _pickPoster=null, _pickYear=null, _pickTmdbId=null, _tmdbTimer=null, _tmdbResults=[];
var _bq="", _btimer=null, _mv=null, _pf=null, _personBack=null, _movieBack="buscar";

/* ---- utils ---- */
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function genId(){var s="";for(var i=0;i<16;i++)s+=ALPHA[Math.floor(Math.random()*ALPHA.length)];return s.toLowerCase();}
function genCode(){var s="";for(var i=0;i<6;i++)s+=ALPHA[Math.floor(Math.random()*ALPHA.length)];return s;}
function initials(n){n=(n||"").trim();if(!n)return "?";var p=n.split(/\s+/);return (p.length>1?(p[0][0]+p[1][0]):n.slice(0,2)).toUpperCase();}
function colorFor(id){id=id||"";var h=0;for(var i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))>>>0;return AVA_COLORS[h%AVA_COLORS.length];}
function isFounder(uid){ return !!(FOUNDER_UID && uid===FOUNDER_UID); }
function founderTag(){ return ' <span class="sep">·</span> <span class="founder">'+esc(FOUNDER_TITLE)+'</span>'; }
function personRow(uid,name,right){ return '<div class="prow"><span class="ava" style="background:'+colorFor(uid)+'">'+esc(initials(name))+'</span><span class="nm">'+esc(name)+(uid===me.id?' <span class="sep">·</span> <span class="you">tú</span>':'')+(isFounder(uid)?founderTag():'')+'</span>'+(right||'')+'</div>'; }
function fmtRating(n){ return (n%1===0)?String(n):String(n).replace(".",","); }
function fmtAvg(n){ return n.toFixed(1).replace(".",","); }
function starsInner(r){ var h=""; for(var i=1;i<=5;i++){ var full=r>=i, half=!full&&r>=i-0.5; h+='<span class="starwrap"><button class="starhalf left" data-act="setStar" data-arg="'+(i-0.5)+'"></button><button class="starhalf right" data-act="setStar" data-arg="'+i+'"></button><span class="star '+(full?"full":half?"half":"")+'">★</span></span>'; } return h; }
function starsDisplay(r){ var h='<span class="starsro">'; for(var i=1;i<=5;i++){ var full=r>=i, half=!full&&r>=i-0.5; h+='<span class="sro '+(full?"full":half?"half":"")+'">★</span>'; } return h+'</span>'; }
function posterUrl(p,size){ return p?("https://image.tmdb.org/t/p/"+(size||"w154")+p):null; }
function posterBox(p,cls){ var u=posterUrl(p,"w185"); return '<div class="poster'+(cls?(" "+cls):"")+'">'+(u?'<img loading="lazy" src="'+esc(u)+'" alt="">':'<span class="noimg">🎬</span>')+'</div>'; }
function faceBox(pp,name){ var u=pp?("https://image.tmdb.org/t/p/w185"+pp):null; return '<div class="cface">'+(u?'<img loading="lazy" src="'+esc(u)+'" alt="">':esc(initials(name||"?")))+'</div>'; }
function runtimeFmt(m){ if(!m)return ""; var h=Math.floor(m/60), mm=m%60; return (h?h+"h ":"")+(mm?mm+"min":(h?"":"0min")); }
function dedupeCredits(arr){ var seen={},out=[]; arr.forEach(function(c){ if(c.id&&!seen[c.id]){seen[c.id]=1;out.push(c);} }); return out; }
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove("show");},2600);}
function sheetErr(msg){var s=modal&&modal.querySelector(".sheet");if(!s)return;var e=s.querySelector(".err");if(!e){e=document.createElement("div");e.className="err";s.appendChild(e);}e.textContent=msg;}
function loginErr(msg){var e=$("loginerr");if(e)e.textContent=msg||"";}
function errText(e){ if(!e)return "Error desconocido.";var m=e.message||String(e);
  if(/Failed to fetch|NetworkError|fetch/i.test(m))return "Sin conexión con la base de datos. Revisa la URL y la clave de Supabase.";
  if(e.code==="23505")return "Ya existía (duplicado).";
  if(/row-level security|violates row|permission|not authorized/i.test(m))return "La base de datos rechazó la operación (revisa el SQL / RLS).";
  if(/column .* does not exist|movie_ratings|actor_ratings|tmdb_id|does not exist/i.test(m))return "Falta algo en la base de datos. Ejecuta el SQL de la Fase 2.";
  return "No se pudo guardar: "+m; }
function authErrText(e){ var m=(e&&e.message)||"";
  if(/Invalid login credentials/i.test(m))return "Correo o contraseña incorrectos.";
  if(/already registered|already exists|User already/i.test(m))return "Ese correo ya tiene cuenta. Pulsa “Entrar”.";
  if(/Password should be at least/i.test(m))return "La contraseña necesita al menos 6 caracteres.";
  if(/Email not confirmed/i.test(m))return "La cuenta aún no está confirmada. (Desactiva “Confirm email” en Supabase.)";
  if(/rate limit|too many/i.test(m))return "Demasiados intentos. Espera un momento.";
  if(/Failed to fetch|NetworkError/i.test(m))return "Sin conexión. Revisa tu internet y la clave.";
  return m||"No se pudo. Inténtalo de nuevo."; }

/* ---- TMDB búsqueda (picker al añadir) ---- */
async function tmdbSearch(q){
  var box=$("tmdbres"); if(!box)return; q=(q||"").trim();
  if(q.length<2){ box.innerHTML=""; return; }
  box.innerHTML='<div class="tmdbloading">buscando…</div>';
  try{
    var r=await fetch("https://api.themoviedb.org/3/search/movie?api_key="+encodeURIComponent(TMDB_KEY)+"&language=es-ES&include_adult=false&query="+encodeURIComponent(q));
    var d=await r.json(); if($("tmdbres")!==box)return;
    _tmdbResults=(d&&d.results?d.results:[]).slice(0,6);
    if(!_tmdbResults.length){ box.innerHTML='<div class="tmdbloading">sin resultados · puedes añadirla a mano</div>'; return; }
    box.innerHTML=_tmdbResults.map(function(m,i){ var yr=(m.release_date||"").slice(0,4); var u=posterUrl(m.poster_path,"w92"); var th=u?'<img loading="lazy" src="'+esc(u)+'" alt="">':"🎬";
      return '<button type="button" class="tmdbitem" data-act="pickTmdb" data-arg="'+i+'"><span class="tmdbth">'+th+'</span><span class="tmdbmeta"><span class="tmdbt">'+esc(m.title||m.original_title||"")+'</span><span class="tmdby">'+esc(yr)+'</span></span></button>'; }).join("");
  }catch(e){ box.innerHTML='<div class="tmdbloading">no se pudo buscar · añádela a mano</div>'; }
}
function renderPickPreview(){ var box=$("tmdbpreview"); if(!box)return;
  if(_pickPoster||_pickTmdbId){ var u=posterUrl(_pickPoster,"w92");
    box.innerHTML='<div class="pickprev">'+(u?'<img src="'+esc(u)+'" alt="">':'')+'<span>Vinculada con TMDB'+(_pickYear?(" · "+esc(_pickYear)):"")+'</span><button type="button" class="btn line sm" data-act="clearPick">Quitar</button></div>';
  } else box.innerHTML=""; }
function bindTitleSearch(){ var e=$("mt"); if(!e)return; e.oninput=function(){ clearTimeout(_tmdbTimer); _tmdbTimer=setTimeout(function(){ tmdbSearch(e.value); },350); }; }

/* ---- arranque + sesión ---- */
async function boot(){
  if(SUPABASE_URL.indexOf("PON_AQUI")>=0||SUPABASE_ANON_KEY.indexOf("PON_AQUI")>=0){ S.view="config"; render(); return; }
  if(!window.supabase||!window.supabase.createClient){ S.view="config"; render(); return; }
  try{ sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY); }catch(e){ S.view="config"; render(); return; }
  sb.auth.onAuthStateChange(function(ev){ if(ev==="SIGNED_OUT"){ teardown(); S.listId=null; S.homeLists=null; cloudReady=false; S.view="login"; render(); } });
  var r; try{ r=await sb.auth.getSession(); }catch(e){ S.view="login"; render(); return; }
  var session=r&&r.data&&r.data.session;
  if(!session){ S.view="login"; render(); return; }
  afterAuth(session);
}
function afterAuth(session){
  me.id=session.user.id;
  var nm=(session.user.user_metadata&&session.user.user_metadata.name)||localStorage.getItem("arsoss.name")||"";
  me.name=nm; cloudReady=true;
  var hash=(location.hash||"").replace(/^#/,"").trim();
  if(!nm){ S.view="needName"; S._pendingHash=hash||null; render(); return; }
  localStorage.setItem("arsoss.name",nm);
  if(hash){ openList(hash); return; }
  S.view="home"; render(); loadMyLists();
}
async function loadMyLists(){
  if(!sb||!me.id)return;
  S.homeLoading=true; if(S.view==="home")render();
  var ids=[];
  try{ var r1=await sb.from("members").select("list_id").eq("user_id",me.id); if(r1.error)throw r1.error; ids=(r1.data||[]).map(function(x){return x.list_id;}); }
  catch(e){ S.homeLoading=false; if(S.view==="home")render(); toast(errText(e)); return; }
  var lists=[];
  if(ids.length){ try{ var r2=await sb.from("lists").select("id,name,code,is_public,created_at").in("id",ids).order("created_at",{ascending:false}); if(!r2.error) lists=(r2.data||[]).map(function(l){return {id:l.id,name:l.name,code:l.code,isPublic:l.is_public};}); }catch(e2){} }
  S.homeLists=lists; S.homeLoading=false; if(S.view==="home")render();
}

/* ---- datos de una lista ---- */
async function fetchState(id){
  var r;
  try{ r=await Promise.all([ sb.from("lists").select("*").eq("id",id).maybeSingle(), sb.from("members").select("*").eq("list_id",id), sb.from("movies").select("*").eq("list_id",id).order("created_at",{ascending:false}) ]); }
  catch(e){ S.loading=false; toast(errText(e)); renderMaybe(); return; }
  if(S.listId!==id)return;
  if(r[0].error){ S.loading=false; toast(errText(r[0].error)); renderMaybe(); return; }
  var L=r[0].data; if(!L){ S.meta="__missing__"; S.loading=false; renderMaybe(); return; }
  S.meta={name:L.name,isPublic:L.is_public,code:L.code,tags:L.tags||[],createdBy:L.created_by};
  S.members=(r[1].data||[]).map(function(m){return {id:m.user_id,name:m.name};});
  S.movies=(r[2].data||[]).map(function(m){return {id:m.id,title:m.title,note:m.note,tags:m.tags||[],addedBy:m.added_by,addedByName:m.added_by_name,createdAt:m.created_at,poster:m.poster||null,year:m.year||null,tmdbId:m.tmdb_id||null};});
  S.mrat={};
  var tset={}; S.movies.forEach(function(m){ if(m.tmdbId)tset[m.tmdbId]=1; });
  var ids=Object.keys(tset), mids=S.members.map(function(m){return m.id;});
  if(ids.length&&mids.length){ try{ var rr=await sb.from("movie_ratings").select("tmdb_id,user_id,rating").in("tmdb_id",ids).in("user_id",mids); (rr.data||[]).forEach(function(x){ S.mrat[x.tmdb_id+"__"+x.user_id]={rating:x.rating}; }); }catch(e){} }
  S.loading=false; renderMaybe(); ensureMember();
}
function scheduleRefetch(){ clearTimeout(_rf); _rf=setTimeout(function(){ if(S.listId)fetchState(S.listId); },300); }
function teardown(){ if(channel){ try{sb.removeChannel(channel);}catch(e){} channel=null; } }
async function openList(id){
  teardown();
  S.listId=id; S.view="list"; S.filter="all"; S.meta=null; S.members=[]; S.movies=[]; S.mrat={}; S.loading=true; _memberTried=false;
  if((location.hash||"").replace(/^#/,"")!==id){ try{history.replaceState(null,"","#"+id);}catch(e){} }
  render();
  await fetchState(id);
  channel=sb.channel("arsoss_"+id)
    .on("postgres_changes",{event:"*",schema:"public",table:"lists",filter:"id=eq."+id},scheduleRefetch)
    .on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"list_id=eq."+id},scheduleRefetch)
    .on("postgres_changes",{event:"*",schema:"public",table:"movies",filter:"list_id=eq."+id},scheduleRefetch)
    .on("postgres_changes",{event:"*",schema:"public",table:"movie_ratings"},scheduleRefetch)
    .subscribe();
}
function ensureMember(){
  var mine=S.members.filter(function(m){return m.id===me.id;})[0];
  if(mine&&mine.name===me.name)return;
  if(_memberTried&&mine)return; _memberTried=true;
  sb.from("members").upsert({list_id:S.listId,user_id:me.id,name:me.name},{onConflict:"list_id,user_id"}).then(function(){});
}

/* ---- acciones de lista ---- */
async function createList(name,isPublic){
  var id=genId(),code=genCode(),res,attempt;
  for(attempt=0;attempt<5;attempt++){ res=await sb.from("lists").insert({id:id,name:name,is_public:isPublic,code:code,tags:[],created_by:me.id}); if(!res.error)break; if(res.error.code==="23505"){ code=genCode(); continue; } break; }
  if(res.error){ sheetErr(errText(res.error)); return; }
  await sb.from("members").insert({list_id:id,user_id:me.id,name:me.name});
  closeModal(); openList(id);
}
async function joinByCode(code){
  code=(code||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
  if(code.length<4){ sheetErr("El código está incompleto."); return; }
  var res=await sb.from("lists").select("id").eq("code",code).maybeSingle();
  if(res.error){ sheetErr(errText(res.error)); return; }
  if(!res.data){ sheetErr("No existe ninguna lista con ese código."); return; }
  closeModal(); openList(res.data.id);
}
async function addMovie(title,note,tags,poster,year,tmdbId){
  title=(title||"").trim(); if(!title){ sheetErr("Falta el título."); return; }
  var mid=genId();
  var res=await sb.from("movies").insert({id:mid,list_id:S.listId,title:title,note:(note||"").trim(),tags:tags||[],added_by:me.id,added_by_name:me.name,poster:(poster||null),year:(year||null),tmdb_id:(tmdbId||null)});
  if(res.error){ sheetErr(errText(res.error)); return; }
  S.movies.unshift({id:mid,title:title,note:(note||"").trim(),tags:tags||[],addedBy:me.id,addedByName:me.name,createdAt:new Date().toISOString(),poster:(poster||null),year:(year||null),tmdbId:(tmdbId||null)});
  closeModal(); renderMaybe();
}
async function updateMovie(id,title,note,tags,poster,year,tmdbId){
  title=(title||"").trim(); if(!title){ sheetErr("Falta el título."); return; }
  var res=await sb.from("movies").update({title:title,note:(note||"").trim(),tags:tags||[],poster:(poster||null),year:(year||null),tmdb_id:(tmdbId||null)}).eq("id",id);
  if(res.error){ sheetErr(errText(res.error)); return; }
  S.movies.forEach(function(m){ if(m.id===id){ m.title=title; m.note=(note||"").trim(); m.tags=tags||[]; m.poster=(poster||null); m.year=(year||null); m.tmdbId=(tmdbId||null); } });
  closeModal(); renderMaybe();
}
async function deleteMovie(id){
  var res=await sb.from("movies").delete().eq("id",id);
  if(res.error){ sheetErr(errText(res.error)); return; }
  S.movies=S.movies.filter(function(m){return m.id!==id;});
  closeModal(); renderMaybe();
}
async function addMovieToList(listId,title,year,poster,tmdbId){
  var mid=genId();
  var res=await sb.from("movies").insert({id:mid,list_id:listId,title:title,note:"",tags:[],added_by:me.id,added_by_name:me.name,poster:(poster||null),year:(year||null),tmdb_id:(tmdbId||null)});
  closeModal();
  if(res.error){ toast(errText(res.error)); return; }
  toast("Añadida a la lista");
}
async function deleteTagList(){}
async function addTag(name){
  name=(name||"").trim(); if(!name)return null;
  var tags=(S.meta&&S.meta.tags)?S.meta.tags.slice():[];
  for(var i=0;i<tags.length;i++){ if(tags[i].toLowerCase()===name.toLowerCase())return tags[i]; }
  if(tags.length>=24){ toast("Demasiadas etiquetas"); return null; }
  tags.push(name);
  var res=await sb.from("lists").update({tags:tags}).eq("id",S.listId);
  if(res.error){ toast(errText(res.error)); return null; }
  if(S.meta)S.meta.tags=tags; return name;
}
async function deleteTag(tag){
  var tags=((S.meta&&S.meta.tags)||[]).filter(function(t){return t!==tag;});
  var res=await sb.from("lists").update({tags:tags}).eq("id",S.listId);
  if(res.error){ toast(errText(res.error)); return; }
  if(S.meta)S.meta.tags=tags;
  for(var i=0;i<S.movies.length;i++){ var m=S.movies[i]; if((m.tags||[]).indexOf(tag)>=0){ var nt=m.tags.filter(function(t){return t!==tag;}); m.tags=nt; sb.from("movies").update({tags:nt}).eq("id",m.id).then(function(){}); } }
  if(S.filter===tag)S.filter="all";
}
function leaveList(){
  var id=S.listId; teardown(); S.listId=null; try{history.replaceState(null,"","#");}catch(e){}
  if(id)sb.from("members").delete().eq("list_id",id).eq("user_id",me.id).then(function(){loadMyLists();},function(){});
  S.view="home"; render(); loadMyLists();
}

/* ---- notas GLOBALES de película ---- */
async function setMovieRating(tmdbId,rating,meta,dirs){
  rating=(typeof rating==="number"&&rating>0)?rating:null;
  tmdbId=String(tmdbId);
  if(_mv&&String(_mv.id)===tmdbId){ _mv.myRow={rating:rating}; _mv.myRating=rating; }
  S.mrat[tmdbId+"__"+me.id]={rating:rating};
  if(S.view==="movie"||S.view==="list")render();
  var row={user_id:me.id,tmdb_id:tmdbId,rating:rating,title:(meta&&meta.title)||null,poster:(meta&&meta.poster)||null,year:(meta&&meta.year)||null,directors:dirs||[]};
  var res=await sb.from("movie_ratings").upsert(row,{onConflict:"user_id,tmdb_id"});
  if(res.error)toast(errText(res.error));
}
async function removeMovieRating(tmdbId){
  tmdbId=String(tmdbId);
  if(_mv&&String(_mv.id)===tmdbId){ _mv.myRow=null; _mv.myRating=null; }
  delete S.mrat[tmdbId+"__"+me.id];
  if(S.view==="movie"||S.view==="list")render();
  var res=await sb.from("movie_ratings").delete().eq("user_id",me.id).eq("tmdb_id",tmdbId);
  if(res.error)toast(errText(res.error));
}
/* ---- notas GLOBALES de actor ---- */
async function setActorRating(pid,rating,c){
  rating=(typeof rating==="number"&&rating>0)?rating:null;
  if(rating==null){ return removeActorRating(pid); }
  pid=String(pid);
  if(_mv){ _mv.myActors[pid]=rating; render(); }
  var d=_mv.data;
  var row={user_id:me.id,person_id:pid,tmdb_id:String(_mv.id),rating:rating,person_name:c.name||null,person_profile:c.profile_path||null,role_name:c.character||null,movie_title:d.title||null,movie_poster:d.poster_path||null,movie_year:(d.release_date||"").slice(0,4)||null};
  var res=await sb.from("actor_ratings").upsert(row,{onConflict:"user_id,person_id,tmdb_id"});
  if(res.error)toast(errText(res.error));
}
async function removeActorRating(pid){
  pid=String(pid);
  if(_mv){ delete _mv.myActors[pid]; render(); }
  var res=await sb.from("actor_ratings").delete().eq("user_id",me.id).eq("person_id",pid).eq("tmdb_id",String(_mv.id));
  if(res.error)toast(errText(res.error));
}

/* ---- hoja de estrellas genérica ---- */

function seenSet(f){ var set={}; if(!f||!f.tmdbId)return set; S.members.forEach(function(m){ var k=f.tmdbId+"__"+m.id; if(S.mrat[k])set[m.id]=S.mrat[k]; }); return set; }
function isDone(f){ if(!f||!f.tmdbId||S.members.length===0)return false; var set=seenSet(f); return S.members.every(function(m){return set[m.id];}); }
function listRatingStats(f){ if(!f||!f.tmdbId)return null; var vals=[]; S.members.forEach(function(m){ var r=S.mrat[f.tmdbId+"__"+m.id]; if(r&&typeof r.rating==="number"&&r.rating>0)vals.push(r.rating); }); if(!vals.length)return null; var s=0;vals.forEach(function(v){s+=v;}); return {avg:s/vals.length,count:vals.length}; }

async function tmdbMovie(id){
  try{
    var out=await Promise.all([
      fetch("https://api.themoviedb.org/3/movie/"+id+"?api_key="+encodeURIComponent(TMDB_KEY)+"&language=es-ES&append_to_response=credits").then(function(r){return r.json();}),
      sb.from("movie_ratings").select("rating").eq("user_id",me.id).eq("tmdb_id",String(id)).maybeSingle(),
      sb.from("actor_ratings").select("person_id,rating").eq("user_id",me.id).eq("tmdb_id",String(id))
    ]);
    if(!_mv||String(_mv.id)!==String(id)||S.view!=="movie")return;
    var d=out[0], mr=out[1], ar=out[2];
    var myActors={}; (ar&&ar.data?ar.data:[]).forEach(function(a){ myActors[String(a.person_id)]=a.rating; });
    _mv={id:String(id),loading:false,data:d,myRow:(mr&&mr.data)?{rating:mr.data.rating}:null,myRating:(mr&&mr.data)?mr.data.rating:null,myActors:myActors};
    render();
  }catch(e){ if(_mv&&String(_mv.id)===String(id)){ _mv={id:String(id),loading:false,error:true,myActors:{}}; render(); } }
}

function openRateActorSheet(pid){

function rateMovieFicha(){
